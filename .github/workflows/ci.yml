name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

      - name: Verify Python tests and compilation
        run: |
          # Local verification equivalent: python3 -m pytest -q
          # Local verification equivalent: python3 -m compileall
          python -m pytest -q
          PYTHONPYCACHEPREFIX=/tmp/hermes-insu-compile-cache python -m compileall -q hermes_insu app.py run_local.py build_exe.py tests

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend tests and build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build
